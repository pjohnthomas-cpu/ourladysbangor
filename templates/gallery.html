<!-- GALLERY -->
<div class="gallery-bg" id="gallery">
  <div class="section" style="padding-top:0;padding-bottom:0;">
    <div class="divider"></div>
    <h2 class="section-title">Our Church</h2>
    <p class="section-subtitle">Views from Our Lady &amp; St. James, Bangor</p>
  </div>
  <div class="gallery-inner">
    <div class="gallery-grid" id="gallery-thumbs">
      <figure data-caption="Church interior">
        <img src="IMG_9997.jpeg" alt="Church interior" loading="lazy">
      </figure>
      <figure data-caption="Church detail">
        <img src="IMG_9995 2.jpeg" alt="Church detail" loading="lazy">
      </figure>
      <figure data-caption="Architectural feature">
        <img src="IMG_9993.jpeg" alt="Architectural feature" loading="lazy">
      </figure>
      <figure data-caption="Church setting">
        <img src="IMG_9992 3.jpeg" alt="Church setting" loading="lazy">
      </figure>
    </div>
  </div>
</div>

<!-- Lightbox overlay -->
<div id="lb-overlay" role="dialog" aria-modal="true" aria-label="Image viewer">
  <button id="lb-close" aria-label="Close">&times;</button>
  <button class="lb-nav" id="lb-prev" aria-label="Previous image">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <button class="lb-nav" id="lb-next" aria-label="Next image">&#8250;</button>
  <p id="lb-caption"></p>
</div>
